name: starter

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Not published to the host: nothing outside compose needs it, and it keeps
    # the starter from fighting whatever else you have on 5432.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Available if you want a queue or cache. Nothing uses it out of the box.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/srv
      # Keep the image's node_modules; do not let the host dir shadow it.
      - /srv/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  storage:
